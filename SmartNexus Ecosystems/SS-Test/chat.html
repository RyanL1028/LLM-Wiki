async function sendMessage(convId, text, fileData, replyTo, pollData) {
  const s = getSession();
  if (!s || (!text.trim() && !fileData && !pollData)) return;
  const msg = {
    conversationId: convId,
    sender: s.username,
    senderUid: s.uid,
    text: text.trim() || '',
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  };
  if (replyTo) msg.replyTo = replyTo;
  if (pollData) msg.poll = pollData;
  if (fileData) {
    // Store small files inline, chunk larger ones (same pattern as resources)
    const CHUNK_SIZE = 900 * 1024;
    if (fileData.data.length <= CHUNK_SIZE) {
      msg.file = { name: fileData.name, size: fileData.size, type: fileData.type, data: fileData.data };
    } else {
      const totalChunks = Math.ceil(fileData.data.length / CHUNK_SIZE);
      const baseId = db.collection('chatFileChunks').doc().id;
      const batch = db.batch();
      for (let i = 0; i < totalChunks; i++) {
        const chunk = fileData.data.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
        batch.set(db.collection('chatFileChunks').doc(baseId + '_' + i), { msgId: baseId, chunkIndex: i, data: chunk });
      }
      await batch.commit();
      msg.file = { name: fileData.name, size: fileData.size, type: fileData.type, chunkId: baseId, chunks: totalChunks };
    }
  }
  try {
    await db.collection('chatMessages').add(msg);
    const preview = fileData ? (fileData.type && fileData.type.startsWith('image/') ? '📷 Image' : '📎 ' + fileData.name) : text.trim();
    await db.collection('conversations').doc(convId).update({
      lastMessage: { text: preview, sender: s.username, timestamp: new Date() }
    });
    await loadMessagesForConv(convId);
  } catch (e) { console.error('sendMessage error:', e); }
}

async function findOrCreateConversation(type, members, classId, name) {
  const s = getSession();
  if (!s) return null;
  try {
    // Load all conversations for this user and filter in JS to avoid composite index issues
    await loadConversations();
    const convs = _conversationsCache || [];
    let existing = null;
    if (type === 'class' && classId) {
      existing = convs.find(c => c.type === 'class' && c.classId === classId);
    } else if (type === 'dm') {
      const sorted = [...members].sort();
      existing = convs.find(c => c.type === 'dm' && JSON.stringify(c.members) === JSON.stringify(sorted));
    }
    if (existing) return existing.id;

    // Create new conversation
    const conv = {
      type, members: type === 'dm' ? [...members].sort() : members,
      classId: classId || null,
      name: name || null,
      createdBy: s.username,
      createdByUid: s.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastMessage: null
    };
    const ref = await db.collection('conversations').add(conv);
    await loadConversations();
    return ref.id;
  } catch (e) { console.error('findOrCreateConversation error:', e); return null; }
}

async function openClassChat(classId) {
  const cls = getClasses().find(c => c.id === classId);
  if (!cls) return;
  const members = [cls.teacher, ...(cls.students || [])].filter(Boolean);
  const convId = await findOrCreateConversation('class', members, classId, cls.name + ' - ' + cls.subject);

/* ===== Chat Polling ===== */

function startChatPolling() {
  stopChatPolling();
  _chatPollInterval = setInterval(pollForNewMessages, 3000);
}

function stopChatPolling() {
  if (_chatPollInterval) { clearInterval(_chatPollInterval); _chatPollInterval = null; }
}

var _lastNotified = {};

function getConvNameById(convId) {
  var convs = _conversationsCache || [];
  var c = convs.find(function(x) { return x.id === convId; });
  return c ? getConversationDisplayName(c) : 'Chat';
}

async function pollForNewMessages() {
  var s = getSession();
  if (!s) return;
  try {
    var oldConvs = _conversationsCache ? JSON.parse(JSON.stringify(_conversationsCache)) : null;
    await loadConversations();
    if (_chatActiveConvId) {
      var oldMsgs = _chatMessagesCache && _chatMessagesCache[_chatActiveConvId] ? _chatMessagesCache[_chatActiveConvId].slice() : [];
      await loadMessagesForConv(_chatActiveConvId);
      var newMsgs = _chatMessagesCache && _chatMessagesCache[_chatActiveConvId] ? _chatMessagesCache[_chatActiveConvId] : [];
      for (var i = 0; i < newMsgs.length; i++) {
        var m = newMsgs[i];
        var msgId = m.id || (m.timestamp && m.timestamp.seconds ? '' + m.timestamp.seconds : '') + '_' + (m.sender || '');
        var isOld = oldMsgs.some(function(o) { return o.id === m.id; });
        if (!isOld && m.sender !== s.username && !_lastNotified[msgId]) {
          _lastNotified[msgId] = true;
          var convName = getConvNameById(_chatActiveConvId);
          addNotification('chat', m.sender + ' in ' + convName + ': ' + ((m.text || '(file)').substring(0, 60)), '#chats');
        }
      }
      renderChatConversation(_chatActiveConvId);
    } else {
      if (oldConvs) {
        for (var ci = 0; ci < _conversationsCache.length; ci++) {
          var conv = _conversationsCache[ci];
          var oldConv = oldConvs.find(function(c) { return c.id === conv.id; });
          if (oldConv && conv.lastMessage && conv.lastMessage.text) {
            var lm = conv.lastMessage;
            var lastKey = (lm.timestamp && lm.timestamp.seconds ? '' + lm.timestamp.seconds : '') + '_' + lm.sender;
            var oldLm = oldConv.lastMessage;
            var oldLastKey = oldLm ? ((oldLm.timestamp && oldLm.timestamp.seconds ? '' + oldLm.timestamp.seconds : '') + '_' + oldLm.sender) : '';
            if (lastKey !== oldLastKey && lm.sender !== s.username && !_lastNotified[lastKey]) {
              _lastNotified[lastKey] = true;
              var info = getConvNameById(conv.id);
              addNotification('chat', lm.sender + ' in ' + info + ': ' + ((lm.text || '').substring(0, 60)), '#chats');
            }
          }
        }
      }
    }
    renderChatSidebar();
  } catch (e) { /* silent */ }
}

/* ===== Chat Unread Tracking ===== */

function getChatReadKey() {
  const s = getSession();
  return s ? 'llmwiki_chat_read_' + s.username : 'llmwiki_chat_read_anon';
}

function getLastReadTimestamp(convId) {
  const data = LS.get(getChatReadKey(), {});
  return data[convId] || null;
}

function markConversationRead(convId) {
  const key = getChatReadKey();
  const data = LS.get(key, {});
  data[convId] = new Date().toISOString();
  LS.set(key, data);
}

function getUnreadCount(convId, messages) {
  const lastRead = getLastReadTimestamp(convId);
  if (!lastRead) return 0;
  let count = 0;
  const s = getSession();
  for (const m of messages) {
    const ts = m.timestamp && m.timestamp.seconds ? new Date(m.timestamp.seconds * 1000).toISOString() : m.timestamp;
    if (ts > lastRead && m.sender !== (s ? s.username : '')) count++;
  }
  return count;
}

/* ===== Chat Helpers ===== */

function formatChatTimestamp(ts) {
  if (!ts) return '';
  const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
  if (isNaN(d.getTime())) return '';
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const msgDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffDays = Math.floor((today - msgDay) / 86400000);
  if (diffDays === 0) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (diffDays === 1) return 'Yesterday';
  if (diffDays < 7) return d.toLocaleDateString([], { weekday: 'short' });
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function getConversationDisplayName(conv) {
  const s = getSession();
  if (conv.type === 'dm') {
    const other = (conv.members || []).find(m => m !== (s ? s.username : ''));
    return other || 'Unknown';
  }
  return conv.name || 'Group Chat';
}

function getConversationInitial(conv) {
  const name = getConversationDisplayName(conv);
  return name.charAt(0).toUpperCase();
}

/* ===== Chat Folders ===== */
function loadChatFolders() {
  try {
    _chatFolders = JSON.parse(localStorage.getItem('llmwiki_chat_folders') || '[]');
  } catch(e) { _chatFolders = []; }
}

function saveChatFolders() {
  localStorage.setItem('llmwiki_chat_folders', JSON.stringify(_chatFolders));
}

function createChatFolder(name) {
  name = (name || '').trim();
  if (!name) return;
  if (_chatFolders.find(function(f) { return f.name === name; })) return;
  _chatFolders.push({ name: name, convs: [], collapsed: false });
  saveChatFolders();
  renderChatSidebar();
}

function deleteChatFolder(name) {
  _chatFolders = _chatFolders.filter(function(f) { return f.name !== name; });
  saveChatFolders();
  renderChatSidebar();
}

function assignConvToFolder(convId, folderName) {
  // Remove from all folders first
  _chatFolders.forEach(function(f) {
    f.convs = f.convs.filter(function(cid) { return cid !== convId; });
  });
  if (folderName) {
    var folder = _chatFolders.find(function(f) { return f.name === folderName; });
    if (folder) folder.convs.push(convId);
  }
  saveChatFolders();
  renderChatSidebar();
}

function toggleFolderCollapse(name) {
  var folder = _chatFolders.find(function(f) { return f.name === name; });
  if (folder) { folder.collapsed = !folder.collapsed; saveChatFolders(); }
  renderChatSidebar();
}

function showFolderPrompt() {
  var name = prompt('Enter folder name:');
  if (name) createChatFolder(name);
}

function showMoveToFolderMenu(convId, e) {
  e.stopPropagation();
  document.querySelectorAll('.folder-menu').forEach(function(el) { el.remove(); });
  var menu = document.createElement('div');
  menu.className = 'folder-menu';
  menu.style.cssText = 'position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);padding:4px;z-index:200;min-width:150px;';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  var html = '<div style="padding:6px 10px;font-size:0.72rem;color:var(--muted);font-weight:600">Move to folder</div>';
  html += '<button onclick="assignConvToFolder(\'' + convId + '\',null);document.querySelectorAll(\'.folder-menu\').forEach(function(el){el.remove()})" style="display:block;width:100%;text-align:left;padding:6px 10px;background:none;border:none;cursor:pointer;font-size:0.8rem;border-radius:4px">📁 None (All Chats)</button>';
  _chatFolders.forEach(function(f) {
    html += '<button onclick="assignConvToFolder(\'' + convId + '\',\'' + f.name.replace(/'/g, '\\\'') + '\');document.querySelectorAll(\'.folder-menu\').forEach(function(el){el.remove()})" style="display:block;width:100%;text-align:left;padding:6px 10px;background:none;border:none;cursor:pointer;font-size:0.8rem;border-radius:4px">📁 ' + f.name + '</button>';
  });
  menu.innerHTML = html;
  document.body.appendChild(menu);
  setTimeout(function() {
    document.addEventListener('click', function closeFolderMenu() {
      var m = document.querySelector('.folder-menu');
      if (m) m.remove();
      document.removeEventListener('click', closeFolderMenu);
    }, { once: true });
  }, 0);
}

function renderChatSidebar() {
  const sidebar = document.getElementById('chat-sidebar');
  if (!sidebar) return;
  const s = getSession();
  const conversations = getConversations();
  const isTeacher = s && (s.role === 'teacher' || s.role === 'admin' || s.role === 'mainadmin' || s.role === 'ultimateadmin');
  loadChatFolders();

  // Track which conv IDs are in folders
  var folderConvs = [];
  _chatFolders.forEach(function(f) { folderConvs = folderConvs.concat(f.convs); });

  var html = '<div class="chat-sidebar-header"><h3>Chats</h3><div style="display:flex;gap:4px;align-items:center">';
  html += '<button class="chat-sb-btn" onclick="showSearchModal()" title="Search">🔍</button>';
  html += '<button class="chat-sb-btn" onclick="showFolderPrompt()" title="New Folder">📁</button>';
  html += '<button class="chat-sb-btn" onclick="renderNewChatModal()" title="New Chat" style="color:var(--accent);font-weight:700;font-size:1.1rem">+</button>';
  html += '</div></div><div class="chat-list" id="chat-list">';

  if (!conversations.length) {
    html += '<div class="chat-no-conv">No conversations yet.<br><span style="font-size:0.78rem">Join a class or start a direct message.</span></div>';
  } else {
    function renderConvItem(c) {
      var messages = getMessagesForConv(c.id);
      var unread = getUnreadCount(c.id, messages);
      var lastMsg = c.lastMessage;
      var activeClass = _chatActiveConvId === c.id ? ' active' : '';
      return '<div class="chat-list-item' + activeClass + '" onclick="selectConversation(\'' + c.id + '\')" oncontextmenu="showMoveToFolderMenu(\'' + c.id + '\',event);return false">' +
        '<div class="chat-list-item-avatar">' + getConversationInitial(c) + '</div>' +
        '<div class="chat-list-item-info">' +
          '<div class="chat-list-item-name">' + getConversationDisplayName(c) + '</div>' +
          '<div class="chat-list-item-preview">' + (lastMsg ? lastMsg.sender + ': ' + lastMsg.text : 'No messages yet') + '</div>' +
        '</div>' +
        '<div class="chat-list-item-meta">' +
          '<div class="chat-list-item-time">' + (lastMsg ? formatChatTimestamp(lastMsg.timestamp) : '') + '</div>' +
          (unread > 0 ? '<div class="chat-list-item-badge">' + unread + '</div>' : '') +
        '</div>' +
      '</div>';
    }

    // Render folder sections
    _chatFolders.forEach(function(f) {
      var collapsedClass = f.collapsed ? ' collapsed' : '';
      html += '<div class="chat-folder-section"><div class="chat-folder-header' + collapsedClass + '" onclick="toggleFolderCollapse(\'' + f.name.replace(/'/g, '\\\'') + '\')"><span class="folder-arrow">▼</span> ' + f.name + ' (' + f.convs.length + ')<button onclick="event.stopPropagation();deleteChatFolder(\'' + f.name.replace(/'/g, '\\\'') + '\')" style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:0.7rem;color:var(--red)">✕</button></div>';
      html += '<div class="chat-folder-items' + collapsedClass + '">';
      f.convs.forEach(function(cid) {
        var c = conversations.find(function(x) { return x.id === cid; });
        if (c) html += renderConvItem(c);
      });
      html += '</div></div>';
    });

    // Render unfoldered chats
    var unfoldered = conversations.filter(function(c) { return !folderConvs.includes(c.id); });
    if (unfoldered.length) {
      if (_chatFolders.length) {
        html += '<div class="chat-folder-section"><div class="chat-folder-header" style="cursor:default">All Chats (' + unfoldered.length + ')</div>';
      }
      unfoldered.forEach(function(c) { html += renderConvItem(c); });
      if (_chatFolders.length) html += '</div>';
    }
  }
  html += '</div>';
  sidebar.innerHTML = html;
}

/* ===== Stories / Status ===== */
async function loadStories() {
  var s = getSession();
  if (!s) return [];
  try {
    var cutoff = new Date(Date.now() - 24 * 60 * 60 * 1000);
    var snap = await db.collection('stories')
      .where('timestamp', '>=', firebase.firestore.Timestamp.fromDate(cutoff))
      .orderBy('timestamp', 'desc').limit(50).get();
    var stories = [];
    snap.forEach(function(doc) { var d = doc.data(); d.id = doc.id; stories.push(d); });
    return stories;
  } catch(e) { return []; }
}

function openStoryViewer(username) {
  loadStories().then(function(stories) {
    var userStories = stories.filter(function(s) { return s.sender === username; });
    if (!userStories.length) return;
    _storyViewerOpen = true;
    var idx = 0;
    var html = '<div class="story-viewer" id="story-viewer" onclick="closeStoryViewer()"><div class="story-viewer-content" onclick="event.stopPropagation()">';
    function renderStory(i) {
      var st = userStories[i];
      var inner = '<div class="story-viewer-header"><div class="story-viewer-user">' + st.sender + '</div><div class="story-viewer-time">' + (st.timestamp && st.timestamp.seconds ? new Date(st.timestamp.seconds * 1000).toLocaleString() : '') + '</div></div>';
      if (st.type === 'photo') {
        inner += '<img src="' + st.content + '" class="story-viewer-media" alt="story">';
      } else {
        inner += '<div class="story-viewer-text-story">' + st.content + '</div>';
      }
      inner += '<div class="story-viewer-progress"><div class="story-viewer-progress-bar" id="story-progress-bar"></div></div>';
      return inner;
    }
    html += renderStory(0);
    html += '<button class="story-viewer-close" onclick="closeStoryViewer()">✕</button>';
    html += '<button class="story-viewer-next" id="story-next-btn" onclick="event.stopPropagation();nextStory()">▶</button>';
    html += '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
    var progressBar = document.getElementById('story-progress-bar');
    if (progressBar) { progressBar.style.transition = 'width 5s linear'; setTimeout(function() { progressBar.style.width = '100%'; }, 50); }
    var timer = setTimeout(nextStory, 5000);
    window._storyTimer = timer;
    window._storyIdx = idx;
    window._storyUserStories = userStories;
    window.nextStory = function() {
      clearTimeout(window._storyTimer);
      window._storyIdx++;
      if (window._storyIdx >= window._storyUserStories.length) { closeStoryViewer(); return; }
      var viewer = document.getElementById('story-viewer');
      if (!viewer) return;
      viewer.querySelector('.story-viewer-content').innerHTML = renderStory(window._storyIdx) + '<button class="story-viewer-close" onclick="closeStoryViewer()">✕</button><button class="story-viewer-next" onclick="event.stopPropagation();nextStory()">▶</button>';
      var pb = document.getElementById('story-progress-bar');
      if (pb) { pb.style.transition = 'none'; pb.style.width = '0'; setTimeout(function() { pb.style.transition = 'width 5s linear'; pb.style.width = '100%'; }, 50); }
      window._storyTimer = setTimeout(nextStory, 5000);
    };
  });
}

function closeStoryViewer() {
  _storyViewerOpen = false;
  clearTimeout(window._storyTimer);
  var viewer = document.getElementById('story-viewer');
  if (viewer) viewer.remove();
}

function renderStoryRings() {
  var sidebar = document.getElementById('chat-sidebar');
  if (!sidebar) return;
  var existing = sidebar.querySelector('.story-rings');
  if (existing) existing.remove();
  loadStories().then(function(stories) {
    if (!stories.length) return;
    var seen = {};
    var unique = [];
    stories.forEach(function(s) {
      if (!seen[s.sender]) { seen[s.sender] = true; unique.push(s); }
    });
    if (!unique.length) return;
    var s = getSession();
    var html = '<div class="story-rings">';
    html += '<div class="story-ring new-story" onclick="showStoryCreator()" title="Add story"><div class="story-ring-avatar" style="background:var(--accent2);color:#fff;display:flex;align-items:center;justify-content:center">+</div></div>';
    unique.forEach(function(st) {
      var hasStory = true;
      var initial = st.sender.charAt(0).toUpperCase();
      html += '<div class="story-ring" onclick="openStoryViewer(\'' + st.sender + '\')" title="' + st.sender + '\'s story"><div class="story-ring-avatar">' + (st.type === 'photo' ? '<img src="' + st.content + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%">' : initial) + '</div><div class="story-ring-name">' + st.sender + '</div></div>';
    });
    html += '</div>';
    var sidebarHeader = sidebar.querySelector('.chat-sidebar-header');
    if (sidebarHeader) sidebarHeader.insertAdjacentHTML('afterend', html);
  });
}

/* Delete expired stories */
async function deleteExpiredStories() {
  try {
    var cutoff = new Date(Date.now() - 25 * 60 * 60 * 1000);
    var snap = await db.collection('stories')
      .where('timestamp', '<', firebase.firestore.Timestamp.fromDate(cutoff))
      .limit(50).get();
    var batch = db.batch();
    snap.forEach(function(doc) { batch.delete(doc.ref); });
    if (!snap.empty) await batch.commit();
  } catch(e) { /* silent */ }
}

/* ===== WebRTC Calling ===== */
var _callListeners = {};
var _callRingtoneCtx = null;

function playRingtone() {
  try {
    _callRingtoneCtx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = _callRingtoneCtx.createOscillator();
    var gain = _callRingtoneCtx.createGain();
    osc.connect(gain);
    gain.connect(_callRingtoneCtx.destination);
    osc.type = 'sine';
    gain.gain.value = 0.15;
    osc.frequency.value = 480;
    osc.start();
    var beep = true;
    var interval = setInterval(function() {
      if (!_callRingtoneCtx) { clearInterval(interval); return; }
      osc.frequency.value = beep ? 600 : 480;
      beep = !beep;
    }, 400);
    window._ringInterval = interval;
  } catch(e) { /* silent */ }
}

function stopRingtone() {
  if (_callRingtoneCtx) { _callRingtoneCtx.close(); _callRingtoneCtx = null; }
  if (window._ringInterval) { clearInterval(window._ringInterval); window._ringInterval = null; }
}

async function initiateCall(convId, mode) {
  var s = getSession();
  if (!s || _activeCallId) return;
  mode = mode || 'audio';
  try {
    _localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: mode === 'video' });
    var callRef = await db.collection('calls').add({
      conversationId: convId,
      caller: s.username,
      callerUid: s.uid,
      mode: mode,
      status: 'ringing',
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    _activeCallId = callRef.id;
    _callMode = mode;
    // Listen for answer
    _callListeners.answer = callRef.onSnapshot(function(doc) {
      var data = doc.data();
      if (!data) return;
      if (data.status === 'answered') { startPeerConnection(callRef, true); }
      if (data.status === 'ended') { endCall(); }
    });
    // Listen for signaling
    listenForSignals(callRef.id, true);
    showCallOverlay(mode, 'outgoing', convId);
    // Auto-end after 60s if no answer
    window._callTimeout = setTimeout(function() {
      if (_activeCallId === callRef.id) { endCall(); }
    }, 60000);
  } catch(e) { console.error('Call init error:', e); alert('Could not access camera/microphone.'); }
}

function listenForIncomingCalls() {
  var s = getSession();
  if (!s) return;
  // Get conversation IDs the user is a member of
  var convs = getConversations();
  var convIds = convs.map(function(c) { return c.id; });
  if (!convIds.length) return;
  // Listen for calls to conversations this user is in, where status is ringing and user is not caller
  _callListeners.incoming = db.collection('calls')
    .where('status', '==', 'ringing')
    .onSnapshot(function(snap) {
      snap.docChanges().forEach(function(change) {
        if (change.type !== 'added') return;
        var call = change.doc.data();
        call.id = change.doc.id;
        if (!convIds.includes(call.conversationId)) return;
        if (call.callerUid === s.uid) return;
        if (_activeCallId) return;
        showIncomingCallUI(call);
      });
    });
}

function showIncomingCallUI(call) {
  var html = '<div class="call-incoming" id="call-incoming"><div class="call-incoming-content"><div class="call-incoming-avatar">' + call.caller.charAt(0).toUpperCase() + '</div><div class="call-incoming-name">' + call.caller + '</div><div class="call-incoming-mode">Incoming ' + (call.mode === 'video' ? 'video' : 'audio') + ' call...</div><div class="call-incoming-btns"><button onclick="answerIncomingCall(\'' + call.id + '\',\'' + call.mode + '\')" style="background:#10b981;color:#fff;border:none;border-radius:50%;width:48px;height:48px;font-size:1.2rem;cursor:pointer">📞</button><button onclick="rejectIncomingCall(\'' + call.id + '\')" style="background:#ef4444;color:#fff;border:none;border-radius:50%;width:48px;height:48px;font-size:1.2rem;cursor:pointer">✕</button></div></div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  playRingtone();
}

async function answerIncomingCall(callId, mode) {
  stopRingtone();
  var el = document.getElementById('call-incoming');
  if (el) el.remove();
  try {
    _localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: mode === 'video' });
    _activeCallId = callId;
    _callMode = mode;
    await db.collection('calls').doc(callId).update({ status: 'answered' });
    var callRef = db.collection('calls').doc(callId);
    _callListeners.answer = callRef.onSnapshot(function(doc) {
      var data = doc.data();
      if (!data) return;
      if (data.status === 'ended') { endCall(); }
    });
    listenForSignals(callId, false);
    startPeerConnection(callRef, false);
    showCallOverlay(mode, 'active', null);
  } catch(e) { console.error('Answer error:', e); }
}

function rejectIncomingCall(callId) {
  stopRingtone();
  var el = document.getElementById('call-incoming');
  if (el) el.remove();
  db.collection('calls').doc(callId).update({ status: 'ended' });
}

async function startPeerConnection(callRef, isCaller) {
  var config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
  _peerConnection = new RTCPeerConnection(config);
  _localStream.getTracks().forEach(function(track) { _peerConnection.addTrack(track, _localStream); });
  _peerConnection.onicecandidate = function(e) {
    if (e.candidate) {
      db.collection('callSignals').add({
        callId: callRef.id,
        type: 'ice',
        candidate: JSON.stringify(e.candidate),
        sender: isCaller ? 'caller' : 'answerer'
      });
    }
  };
  _peerConnection.ontrack = function(e) {
    var remoteAudio = document.getElementById('call-remote-audio');
    if (remoteAudio) { remoteAudio.srcObject = e.streams[0]; }
  };
  if (isCaller) {
    var offer = await _peerConnection.createOffer();
    await _peerConnection.setLocalDescription(offer);
    await db.collection('callSignals').add({
      callId: callRef.id,
      type: 'offer',
      sdp: JSON.stringify(offer),
      sender: 'caller'
    });
  } else {
    // Get the offer from signals
    var snap = await db.collection('callSignals')
      .where('callId', '==', callRef.id)
      .where('type', '==', 'offer').limit(1).get();
    if (!snap.empty) {
      var offer = JSON.parse(snap.docs[0].data().sdp);
      await _peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
      var answer = await _peerConnection.createAnswer();
      await _peerConnection.setLocalDescription(answer);
      await db.collection('callSignals').add({
        callId: callRef.id,
        type: 'answer',
        sdp: JSON.stringify(answer),
        sender: 'answerer'
      });
    }
  }
}

function listenForSignals(callId, isCaller) {
  _callListeners.signals = db.collection('callSignals')
    .where('callId', '==', callId)
    .onSnapshot(function(snap) {
      snap.docChanges().forEach(async function(change) {
        if (change.type !== 'added') return;
        var signal = change.doc.data();
        // Skip our own signals
        var myRole = isCaller ? 'caller' : 'answerer';
        if (signal.sender === myRole) return;
        if (!_peerConnection) return;
        if (signal.type === 'offer') {
          // Already handled in answer flow via startPeerConnection
        } else if (signal.type === 'answer') {
          await _peerConnection.setRemoteDescription(new RTCSessionDescription(JSON.parse(signal.sdp)));
        } else if (signal.type === 'ice' && signal.candidate) {
          try {
            await _peerConnection.addIceCandidate(new RTCIceCandidate(JSON.parse(signal.candidate)));
          } catch(e) { /* ICE candidate errors are common and non-fatal */ }
        }
      });
    });
}

function showCallOverlay(mode, status, convId) {
  var existing = document.querySelector('.call-overlay');
  if (existing) existing.remove();
  var conv = convId ? getConversations().find(function(c) { return c.id === convId; }) : null;
  var name = conv ? getConversationDisplayName(conv) : 'Call';
  var html = '<div class="call-overlay" id="call-overlay"><div class="call-overlay-header"><div class="call-overlay-avatar">' + name.charAt(0).toUpperCase() + '</div><div class="call-overlay-info"><div class="call-overlay-name">' + name + '</div><div class="call-overlay-status" id="call-status">' + (status === 'outgoing' ? 'Calling...' : 'Connected') + '</div></div></div>';
  html += '<div class="call-overlay-timer" id="call-timer">00:00</div>';
  html += '<div class="call-overlay-controls">';
  html += '<button class="call-ctrl" onclick="toggleMute()" title="Mute">🎙</button>';
  if (mode === 'video') { html += '<button class="call-ctrl" onclick="toggleVideo()" title="Camera">📹</button>'; html += '<button class="call-ctrl" onclick="startScreenShare()" title="Share screen">🖥</button>'; }
  html += '<button class="call-ctrl call-ctrl-end" onclick="endCall()" title="End call">✕</button>';
  html += '</div>';
  html += '<audio id="call-remote-audio" autoplay playsinline></audio>';
  if (mode === 'video') html += '<video id="call-local-video" class="call-local-video" muted autoplay playsinline></video>';
  html += '</div>';
  document.body.insertAdjacentHTML('beforeend', html);
  // Show local video
  if (mode === 'video' && _localStream) {
    var localVid = document.getElementById('call-local-video');
    if (localVid) localVid.srcObject = _localStream;
  }
  // Start timer if answered
  if (status !== 'outgoing') {
    _callStartTime = Date.now();
    _callTimerInterval = setInterval(function() {
      var elapsed = Math.floor((Date.now() - _callStartTime) / 1000);
      var mins = Math.floor(elapsed / 60);
      var secs = elapsed % 60;
      var el = document.getElementById('call-timer');
      if (el) el.textContent = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
    }, 500);
  }
}

function toggleMute() {
  if (_localStream) {
    var audioTrack = _localStream.getAudioTracks()[0];
    if (audioTrack) { audioTrack.enabled = !audioTrack.enabled; }
  }
}

function toggleVideo() {
  if (_localStream) {
    var videoTrack = _localStream.getVideoTracks()[0];
    if (videoTrack) { videoTrack.enabled = !videoTrack.enabled; }
  }
}

async function endCall() {
  stopRingtone();
  if (window._callTimeout) { clearTimeout(window._callTimeout); }
  if (_callTimerInterval) { clearInterval(_callTimerInterval); _callTimerInterval = null; }
  if (_activeCallId) {
    try { await db.collection('calls').doc(_activeCallId).update({ status: 'ended' }); } catch(e) {}
  }
  if (_peerConnection) { _peerConnection.close(); _peerConnection = null; }
  if (_localStream) { _localStream.getTracks().forEach(function(t) { t.stop(); }); _localStream = null; }
  Object.keys(_callListeners).forEach(function(k) { if (_callListeners[k]) { _callListeners[k](); _callListeners[k] = null; } });
  _activeCallId = null;
  _callMode = null;
  _callStartTime = null;
  var overlay = document.getElementById('call-overlay');
  if (overlay) overlay.remove();
  var incoming = document.getElementById('call-incoming');
  if (incoming) incoming.remove();
}

/* ===== Screen Sharing ===== */
async function startScreenShare() {
  if (!_peerConnection) return;
  try {
    var screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    var screenTrack = screenStream.getVideoTracks()[0];
    var sender = _peerConnection.getSenders().find(function(s) { return s.track && s.track.kind === 'video'; });
    if (sender) {
      sender.replaceTrack(screenTrack);
    } else {
      _peerConnection.addTrack(screenTrack, screenStream);
    }
    // Update local video preview
    var localVid = document.getElementById('call-local-video');
    if (localVid) localVid.srcObject = screenStream;
    // When user stops sharing via browser UI
    screenTrack.onended = function() { stopScreenShare(); };
    window._screenStream = screenStream;
    window._screenTrack = screenTrack;
    // Add share button to call controls
    var controls = document.querySelector('.call-overlay-controls');
    if (controls) {
      var btn = controls.querySelector('[onclick="startScreenShare()"]');
      if (!btn) {
        controls.insertAdjacentHTML('afterbegin', '<button class="call-ctrl" onclick="stopScreenShare()" title="Stop sharing" id="btn-stop-share">🖥</button>');
      }
    }
  } catch(e) { console.error('Screen share error:', e); }
}

function stopScreenShare() {
  if (window._screenTrack) { window._screenTrack.stop(); }
  if (window._screenStream) { window._screenStream.getTracks().forEach(function(t) { t.stop(); }); }
  // Revert to camera video
  if (_localStream && _peerConnection) {
    var videoTrack = _localStream.getVideoTracks()[0];
    if (videoTrack) {
      var sender = _peerConnection.getSenders().find(function(s) { return s.track && s.track.kind === 'video'; });
      if (sender) sender.replaceTrack(videoTrack);
      var localVid = document.getElementById('call-local-video');
      if (localVid) localVid.srcObject = _localStream;
    }
  }
  var btn = document.getElementById('btn-stop-share');
  if (btn) btn.remove();
}

/* ===== Message Search ===== */
function showSearchModal() {
  document.querySelectorAll('.chat-search-modal').forEach(function(el) { el.remove(); });
  var html = '<div class="chat-search-modal" onclick="if(event.target===this)this.remove()"><div class="chat-search-modal-content"><div class="chat-search-input-wrap"><input id="chat-search-input" placeholder="Search messages..." onkeydown="if(event.key===\'Enter\')doMessageSearch()" autofocus><button onclick="doMessageSearch()">🔍</button></div><div class="chat-search-results" id="chat-search-results"><div style="text-align:center;color:var(--muted);padding:20px">Type to search across all conversations</div></div></div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  setTimeout(function() {
    var input = document.getElementById('chat-search-input');
    if (input) input.focus();
  }, 100);
}

function doMessageSearch() {
  var input = document.getElementById('chat-search-input');
  var query = (input ? input.value.trim().toLowerCase() : '');
  var resultsEl = document.getElementById('chat-search-results');
  if (!resultsEl) return;
  if (!query) { resultsEl.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px">Type to search across all conversations</div>'; return; }
  var conversations = getConversations();
  var results = [];
  conversations.forEach(function(c) {
    var msgs = getMessagesForConv(c.id);
    msgs.forEach(function(m) {
      if (m.text && m.text.toLowerCase().indexOf(query) !== -1) {
        results.push({ conv: c, msg: m, sender: m.sender, text: m.text, ts: m.timestamp });
      }
    });
  });
  if (!results.length) {
    resultsEl.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px">No messages found for "' + query + '"</div>';
    return;
  }
  resultsEl.innerHTML = results.slice(0, 30).map(function(r) {
    var ts = r.ts && r.ts.seconds ? new Date(r.ts.seconds * 1000) : (r.ts ? new Date(r.ts) : new Date());
    return '<div class="chat-search-result-item" onclick="jumpToSearchResult(\'' + r.conv.id + '\',\'' + r.msg.id + '\');document.querySelector(\'.chat-search-modal\').remove()"><div class="chat-search-result-conv">' + getConversationDisplayName(r.conv) + '</div><div class="chat-search-result-text"><strong>' + r.sender + ':</strong> ' + r.text.substring(0, 150) + '</div><div class="chat-search-result-time">' + ts.toLocaleString() + '</div></div>';
  }).join('');
}

function jumpToSearchResult(convId, msgId) {
  selectConversation(convId).then(function() {
    setTimeout(function() { scrollToMsg(msgId); }, 300);
  });
}

function _detachMsgListener() {
  if (_chatMsgListener) { _chatMsgListener(); _chatMsgListener = null; }
}
function _detachTypingListener() {
  if (_chatTypingListener) { _chatTypingListener(); _chatTypingListener = null; }
}
function _detachAllListeners() { _detachMsgListener(); _detachTypingListener(); }

async function selectConversation(convId) {
  _detachAllListeners();
  _chatActiveConvId = convId;
  await loadMessagesForConv(convId);
  markConversationRead(convId);
  markMessagesRead(convId); // Firestore read receipts
  renderChatConversation(convId);
  renderChatSidebar();

  // Real-time listener for active conversation messages
  _chatMsgListener = db.collection('chatMessages')
    .where('conversationId', '==', convId)
    .onSnapshot(function(snap) {
      var msgs = [];
      snap.docChanges().forEach(function(change) {
        var data = change.doc.data();
        data.id = change.doc.id;
        msgs.push(data);
      });
      // Full reload to keep order consistent
      loadMessagesForConv(convId).then(function() {
        renderChatConversation(convId);
        renderChatSidebar();
      });
      // Mark messages as read when new ones arrive for active conv
      if (document.hasFocus()) { markMessagesRead(convId); }
    }, function(err) { console.error('Msg listener error:', err); });

  // Real-time typing listener
  _chatTypingListener = db.collection('typingStatus').doc(convId)
    .collection('status').onSnapshot(function(snap) {
      renderChatConversation(convId);
    }, function(err) { /* silent */ });

  // Fix for new poll documents via separate listener
  db.collection('polls').where('conversationId', '==', convId)
    .onSnapshot(function() { renderChatConversation(convId); }, function() {});

  // Mobile: show main, hide sidebar
  if (window.innerWidth <= 600) {
    document.getElementById('chat-sidebar').classList.add('hidden-on-mobile');
    document.getElementById('chat-main').classList.remove('hidden-on-mobile');
  }
}

/* Read receipts: mark all messages in this conv as read by current user */
async function markMessagesRead(convId) {
  var s = getSession();
  if (!s) return;
  try {
    var msgs = getMessagesForConv(convId);
    var toUpdate = [];
    for (var i = 0; i < msgs.length; i++) {
      var m = msgs[i];
      var readBy = m.readBy || [];
      if (m.sender !== s.username && !readBy.includes(s.username)) {
        readBy.push(s.username);
        toUpdate.push(db.collection('chatMessages').doc(m.id).update({ readBy: readBy }));
      }
    }
    if (toUpdate.length) await Promise.all(toUpdate);
  } catch(e) { /* silent */ }
}

function showChatSidebar() {
  document.getElementById('chat-sidebar').classList.remove('hidden-on-mobile');
  document.getElementById('chat-main').classList.add('hidden-on-mobile');
}

/* ===== Message Rendering Helpers ===== */

/* Format text with @mentions and URLs highlighted */
function _formatMsgText(text) {
  if (!text) return '';
  var out = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Highlight @mentions
  out = out.replace(/@(\w+)/g, '<span class="chat-mention">@$1</span>');
  // Convert URLs to clickable links
  out = out.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return out;
}

/* Extract URLs from plain text for link previews */
function _extractUrls(text) {
  if (!text) return [];
  var matches = text.match(/https?:\/\/[^\s]+/g);
  return matches || [];
}

/* Render link preview cards for URLs in a message */
function _renderLinkPreviews(m) {
  if (!m.text) return '';
  var urls = _extractUrls(m.text);
  if (!urls.length) return '';
  var html = '';
  var cache = LS.get('llmwiki_link_previews', {});
  for (var i = 0; i < Math.min(urls.length, 2); i++) {
    var url = urls[i];
    var preview = cache[url];
    if (!preview) {
      // Show just the domain as fallback
      try { var domain = new URL(url).hostname; } catch(e) { domain = url; }
      html += '<a href="' + url + '" target="_blank" rel="noopener" class="chat-link-preview"><div class="chat-link-preview-info"><div class="chat-link-preview-title">' + domain + '</div><div class="chat-link-preview-domain">' + url + '</div></div></a>';
      // Attempt to fetch preview in background
      _fetchLinkPreview(url);
    } else {
      html += '<a href="' + url + '" target="_blank" rel="noopener" class="chat-link-preview">';
      if (preview.image) html += '<img src="' + preview.image + '" class="chat-link-preview-img" alt="">';
      html += '<div class="chat-link-preview-info"><div class="chat-link-preview-title">' + (preview.title || url) + '</div>';
      if (preview.description) html += '<div class="chat-link-preview-desc">' + preview.description + '</div>';
      html += '<div class="chat-link-preview-domain">' + (preview.domain || url) + '</div></div></a>';
    }
  }
  return html;
}

/* Background fetch link preview metadata */
async function _fetchLinkPreview(url) {
  var cache = LS.get('llmwiki_link_previews', {});
  if (cache[url]) return;
  try {
    var resp = await fetch(url, { mode: 'no-cors' });
  } catch(e) {}
  // Store basic domain info (full OG parsing requires a proxy due to CORS)
  try {
    var domain = new URL(url).hostname;
    cache[url] = { domain: domain, title: domain, description: '', image: '' };
    LS.set('llmwiki_link_previews', cache);
  } catch(e) {}
}

/* Render a poll embedded in a message */
function _renderPoll(m) {
  if (!m.poll) return '';
  var p = m.poll;
  var total = 0;
  (p.options || []).forEach(function(o) { total += (o.votes || 0); });
  var html = '<div class="chat-poll"><div class="chat-poll-q">📊 ' + p.question + '</div>';
  (p.options || []).forEach(function(o, i) {
    var pct = total > 0 ? Math.round((o.votes || 0) / total * 100) : 0;
    html += '<button class="chat-poll-opt" onclick="votePoll(\'' + m.id + '\',' + i + ')"><div class="chat-poll-opt-bar" style="width:' + pct + '%"></div><div class="chat-poll-opt-text"><span>' + o.text + '</span><span class="chat-poll-opt-count">' + (o.votes || 0) + '</span></div></button>';
  });
  html += '<div class="chat-poll-total">' + total + ' vote' + (total !== 1 ? 's' : '') + '</div></div>';
  return html;
}

/* Render file attachment - inline if possible */
function _renderMsgFile(m, inline) {
  var f = m.file;
  if (!f) return '';
  if (f.data) {
    if (f.type && f.type.startsWith('image/')) {
      return '<a href="' + f.data + '" target="_blank"><img src="' + f.data + '" class="chat-msg-image" alt="' + f.name + '"></a>';
    }
    if (f.type && f.type.startsWith('audio/')) {
      return '<audio controls class="chat-msg-audio" src="' + f.data + '"></audio>';
    }
    if (f.type && f.type.startsWith('video/')) {
      return '<video controls class="chat-msg-video" src="' + f.data + '"></video>';
    }
    if (f.type === 'application/pdf') {
      return '<div class="chat-msg-pdf"><iframe src="' + f.data + '"></iframe></div>';
    }
    return '<a href="' + f.data + '" download="' + f.name + '" class="chat-msg-file"><span style="font-size:1.2rem">📄</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0">' + f.name + '</span><span style="color:var(--muted);flex-shrink:0;font-size:0.72rem">' + (f.size / 1024).toFixed(0) + 'KB</span></a>';
  }
  // Chunked file
  var icon = (f.type && f.type.startsWith('image/')) ? '🖼' : (f.type && f.type.startsWith('audio/') ? '🎵' : (f.type && f.type.startsWith('video/') ? '🎬' : '📄'));
  return '<a href="#" onclick="event.preventDefault();assembleChatFile(\'' + f.chunkId + '\',' + f.chunks + ',\'' + (f.name || '').replace(/'/g, '\\\'') + '\',\'' + (f.type||'') + '\')" class="chat-msg-file"><span style="font-size:1.2rem">' + icon + '</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0">' + f.name + '</span><span style="color:var(--muted);flex-shrink:0;font-size:0.72rem">' + (f.size / 1024).toFixed(0) + 'KB</span></a>';
}

/* Render read receipt checkmarks */
function _renderReadReceipt(m) {
  var conv = getConversations().find(function(c) { return c.id === _chatActiveConvId; });
  var members = conv ? (conv.members || []).filter(function(x) { return x !== m.sender; }) : [];
  var readBy = m.readBy || [];
  var readCount = members.filter(function(x) { return readBy.includes(x); }).length;
  if (readCount >= members.length && members.length > 0) return ' <span class="chat-msg-read seen">✓✓</span>';
  if (readCount > 0) return ' <span class="chat-msg-read delivered">✓✓</span>';
  return ' <span class="chat-msg-read sent">✓</span>';
}

/* ===== Typing Indicators ===== */
function updateTypingStatus(convId) {
  var s = getSession();
  if (!s || !convId) return;
  db.collection('typingStatus').doc(convId).collection('status').doc(s.username).set({
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  });
}

function getTypingUsers(convId) {
  // Uses cached typing data from onSnapshot - accessed via DOM
  var s = getSession();
  var msgs = getMessagesForConv(convId);
  if (!msgs.length) return [];
  // Find typing users from last poll cache
  var typing = [];
  var now = Date.now();
  // Check the typingStatus collection indirectly via the last render
  var statusEl = document.getElementById('typing-data-' + convId);
  if (statusEl) {
    try {
      var data = JSON.parse(statusEl.textContent || '{}');
      Object.keys(data).forEach(function(username) {
        var ts = data[username];
        if (ts && ts.seconds) {
          var ms = ts.seconds * 1000;
          if (now - ms < 8000 && username !== (s ? s.username : '')) typing.push(username);
        }
      });
    } catch(e) {}
  }
  return typing;
}

function _renderTypingIndicator(convId) {
  var s = getSession();
  var typing = getTypingUsers(convId);
  if (!typing.length) return '';
  var names = typing.slice(0, 2).join(', ');
  if (typing.length > 2) names += ' and ' + (typing.length - 2) + ' more';
  return '<div class="chat-typing">' + names + ' typing<span class="chat-typing-dots"><span></span><span></span><span></span></span></div>';
}

/* ===== @Mention Autocomplete ===== */
function _setupMentionAutocomplete(input) {
  input.addEventListener('input', function() {
    var val = input.value;
    var cursorPos = input.selectionStart;
    var atIdx = val.lastIndexOf('@', cursorPos - 1);
    var existing = document.querySelector('.mention-autocomplete');
    if (atIdx === -1 || (atIdx > 0 && val[atIdx - 1] !== ' ')) {
      if (existing) existing.remove();
      return;
    }
    var query = val.slice(atIdx + 1, cursorPos).toLowerCase();
    var conv = getConversations().find(function(c) { return c.id === _chatActiveConvId; });
    var members = conv ? (conv.members || []) : [];
    var matches = members.filter(function(m) { return m.toLowerCase().startsWith(query); }).slice(0, 6);
    if (!matches.length) { if (existing) existing.remove(); return; }
    if (!existing) {
      var ac = document.createElement('div');
      ac.className = 'mention-autocomplete';
      ac.style.bottom = '100%';
      input.parentElement.style.position = 'relative';
      input.parentElement.appendChild(ac);
      existing = ac;
    }
    existing.innerHTML = matches.map(function(m, i) {
      return '<div class="mention-autocomplete-item' + (i === 0 ? ' active' : '') + '" onclick="_insertMention(\'' + m + '\')">' + m.charAt(0).toUpperCase() + '<span>' + m + '</span></div>';
    }).join('');
  });
  input.addEventListener('keydown', function(e) {
    var ac = document.querySelector('.mention-autocomplete');
    if (!ac) return;
    if (e.key === 'Tab' || e.key === 'Enter') {
      e.preventDefault();
      var active = ac.querySelector('.mention-autocomplete-item.active');
      if (active) active.click();
    }
  });
}

function _insertMention(username) {
  var input = document.getElementById('chat-input');
  if (!input) return;
  var val = input.value;
  var cursorPos = input.selectionStart;
  var atIdx = val.lastIndexOf('@', cursorPos - 1);
  if (atIdx === -1) return;
  input.value = val.slice(0, atIdx) + '@' + username + ' ' + val.slice(cursorPos);
  input.focus();
  var pos = atIdx + username.length + 2;
  input.setSelectionRange(pos, pos);
  var ac = document.querySelector('.mention-autocomplete');
  if (ac) ac.remove();
}

async function votePoll(msgId, optionIndex) {

    poll.options[optionIndex].votes = (poll.options[optionIndex].votes || 0) + 1;
    await ref.update({ poll: poll });

    renderChatConversation(_chatActiveConvId);
  } catch(e) { console.error('Vote error:', e); }
}

function renderChatConversation(convId) {
  const s = getSession();
  const conv = getConversations().find(c => c.id === convId);
  const chatMain = document.getElementById('chat-main');
  if (!conv) { if (chatMain) chatMain.innerHTML = '<div class="chat-empty">Conversation not found</div>'; return; }

  const messages = getMessagesForConv(convId);
  const displayName = getConversationDisplayName(conv);

  const convPic = conv.picture || '';
  let html = '<div class="chat-header">';
  html += '<button class="chat-header-back" onclick="showChatSidebar()">←</button>';
  if (convPic) {
    html += `<img src="${convPic}" class="conv-pic" onclick="triggerConvPicUpload()" title="Click to change picture">`;
  } else {
    html += `<div class="conv-pic-placeholder" onclick="${conv.type !== 'dm' ? 'triggerConvPicUpload()' : ''}" title="${conv.type !== 'dm' ? 'Click to set picture' : ''}">${getConversationInitial(conv)}</div>`;
  }
  html += '<div>';
  html += `<div class="chat-header-name">${displayName}</div>`;
  if (conv.type !== 'dm') {
    html += `<div class="chat-header-members">${(conv.members || []).length} members</div>`;
  }
  html += '</div>';
  html += '<div style="display:flex;align-items:center;gap:6px;margin-left:auto">';
  html += '<button class="chat-call-btn" onclick="initiateCall(\'' + convId + '\',\'audio\')" title="Audio call">📞</button>';
  html += '<button class="chat-call-btn" onclick="initiateCall(\'' + convId + '\',\'video\')" title="Video call">📹</button>';
  html += '</div></div>';

  // Pinned messages
  const pinnedIds = conv.pinnedMsgs || [];
  if (pinnedIds.length) {
    html += '<div class="chat-pinned-bar">';
    html += '<span style="font-size:0.78rem">📌 Pinned:</span> ';
    pinnedIds.forEach(pid => {
      const pmsg = messages.find(m => m.id === pid);
      if (pmsg) {
        html += `<span class="chat-pinned-msg" onclick="scrollToMsg('${pid}')">${pmsg.sender}: ${(pmsg.text || '(file)').substring(0, 60)}</span>`;
      }
    });
    html += '</div>';
  }

  html += _renderTypingIndicator(convId);

  html += '<div class="chat-messages" id="chat-messages">';
  if (!messages.length) {
    html += '<div class="chat-empty">No messages yet. Say hello!</div>';
  } else {
    let lastDate = '';
    messages.forEach(m => {
      const ts = m.timestamp && m.timestamp.seconds ? new Date(m.timestamp.seconds * 1000) : (m.timestamp ? new Date(m.timestamp) : new Date());
      const dateStr = ts.toLocaleDateString();
      if (dateStr !== lastDate) {
        html += '<div class="chat-msg-date-divider">' + dateStr + '</div>';
        lastDate = dateStr;
      }
      const isMine = m.sender === s.username;
      const isStarred = m.starred || (m.starredBy || []).includes(s.username);
      const msgReactions = (m.reactions || []);
      const reactionHTML = msgReactions.length ? '<div class="chat-msg-reactions">' + msgReactions.map(r => '<span class="chat-msg-reaction" onclick="addReaction(\'' + m.id + '\',\'' + r.emoji + '\')">' + r.emoji + '<span style="font-size:0.55rem;margin-left:1px">' + (r.count || 1) + '</span></span>').join('') + '</div>' : '';
      html += `<div class="chat-msg${isMine ? ' mine' : ''}${isStarred ? ' chat-msg-starred' : ''}" data-msg-id="${m.id}" oncontextmenu="showChatContextMenu(event,'${m.id}')">
        <div class="chat-msg-select" onclick="event.stopPropagation();toggleMsgSelect(this,'${m.id}')"></div>
        <div class="chat-msg-avatar">${m.sender.charAt(0).toUpperCase()}</div>
        <div class="chat-msg-bubble">
          ${!isMine ? '<div class="chat-msg-sender">' + m.sender + '</div>' : ''}
          ${(() => { if (!m.replyTo) return ''; const rp = findMsgById(m.replyTo); if (!rp) return ''; return '<div class="chat-msg-reply-preview" onclick="scrollToMsg(\'' + m.replyTo + '\')">↩️ ' + rp.sender + ': ' + (rp.text || '(file)').substring(0, 100) + '</div>'; })()}
          ${m.text ? '<div class="chat-msg-text">' + _formatMsgText(m.text) + '</div>' : ''}
          ${m.edited ? '<span class="chat-msg-edited">(edited)</span>' : ''}
          ${_renderLinkPreviews(m)}
          ${_renderPoll(m)}
          ${reactionHTML}
          ${m.file ? _renderMsgFile(m, true) : ''}
          <div class="chat-msg-time">${ts.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}${isMine ? _renderReadReceipt(m) : ''}</div>
        </div>
      </div>`;
    });
  }
  html += '</div>';

  // Preserve input value, replyTo, and focus across re-renders (polling)
  const existingInput = document.getElementById('chat-input');
  const savedValue = existingInput ? existingInput.value : '';
  const savedReplyTo = existingInput ? existingInput.dataset.replyTo : '';
  const wasFocused = existingInput && document.activeElement === existingInput;

  // Reply indicator
  if (savedReplyTo) {
    const replyMsg = findMsgById(savedReplyTo);
    if (replyMsg) {
      html += '<div class="chat-reply-bar"><span>↩️ Replying to <strong>' + replyMsg.sender + '</strong>: ' + (replyMsg.text || '(file)').substring(0, 80) + '</span><button onclick="cancelReply()" style="background:none;border:none;cursor:pointer;font-size:1.1rem;padding:0 4px">✕</button></div>';
    }
  }

  html += `<div class="chat-input-bar">
    <input type="file" id="chat-file-input" onchange="handleChatFileSelected(this)" accept="image/*,.pdf,.doc,.docx,.txt,.csv,.xlsx,.pptx,.zip" style="display:none">
    <button class="btn-attach" onclick="triggerFileUpload()" title="Attach file">📎</button>

    <div class="chat-input-extra">
      <button class="btn-attach" onclick="toggleInputExtras()" title="More">➕</button>
      <div class="chat-input-extra-menu" id="chat-input-extras">
        <button onclick="showGifPicker();toggleInputExtras()" title="Send GIF">🖼</button>
        <button onclick="showPollCreator();toggleInputExtras()" title="Create poll">📊</button>
        <button onclick="showSchedulePicker();toggleInputExtras()" title="Schedule">🕐</button>
      </div>
    </div>
    <div id="chat-file-preview"></div>
    <input id="chat-input" type="text" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendChatMessage()" oninput="_onChatInput()">
    <button onclick="sendChatMessage()">→</button>
  </div>`;

  if (chatMain) chatMain.innerHTML = html;
  // Restore input value and focus
  const newInput = document.getElementById('chat-input');
  if (savedValue && newInput) { newInput.value = savedValue; }
  if (savedReplyTo && newInput) { newInput.dataset.replyTo = savedReplyTo; newInput.placeholder = 'Replying to...'; }
  if (wasFocused && newInput) { newInput.focus(); }
  setTimeout(scrollChatToBottom, 100);
}

async function assembleChatFile(chunkId, chunks, fileName, fileType) {
  const parts = [];
  for (let i = 0; i < chunks; i++) {
    const doc = await db.collection('chatFileChunks').doc(chunkId + '_' + i).get();
    if (doc.exists) parts.push(doc.data().data);
  }
  const dataUrl = parts.join('');
  if (fileType && fileType.startsWith('image/')) {
    // Open image in new tab
    const w = window.open('', '_blank');
    if (w) { w.document.write('<img src="' + dataUrl + '" style="max-width:100%">'); w.document.title = fileName; }
  } else {
    // Trigger download
    const a = document.createElement('a');
    a.href = dataUrl; a.download = fileName; a.click();
  }
}

async function sendChatMessage() {
  const input = document.getElementById('chat-input');
  const text = input ? input.value.trim() : '';
  if ((!text && !_pendingChatFile) || !_chatActiveConvId) return;
  const replyTo = input ? input.dataset.replyTo : '';
  await sendMessage(_chatActiveConvId, text, _pendingChatFile, replyTo || null);
  if (input) { input.value = ''; delete input.dataset.replyTo; input.placeholder = 'Type a message...'; }
  _pendingChatFile = null;
  const preview = document.getElementById('chat-file-preview');
  if (preview) { preview.innerHTML = ''; preview.style.display = 'none'; }
  renderChatConversation(_chatActiveConvId);
  renderChatSidebar();
  setTimeout(scrollChatToBottom, 100);
}

/* ===== Voice Messages ===== */
var _voiceRecordingCancelled = false;

async function startVoiceRecording() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('Microphone not supported in this browser.');
    return;
  }
  try {
    var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    _recordingMediaRecorder = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm' });
    var chunks = [];
    _voiceRecordingCancelled = false;
    _recordingMediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
    _recordingMediaRecorder.onstop = function() {
      stream.getTracks().forEach(function(t) { t.stop(); });
      if (_voiceRecordingCancelled || !chunks.length) return;
      var blob = new Blob(chunks, { type: _recordingMediaRecorder.mimeType });
      var reader = new FileReader();
      reader.onload = function() {
        _pendingChatFile = { name: 'voice-message-' + new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.webm', size: blob.size, type: blob.type, data: reader.result };
        sendChatMessage();
      };
      reader.readAsDataURL(blob);
    };
    _recordingMediaRecorder.start();
    _recordingStartTime = Date.now();
    _recordingInterval = setInterval(updateRecordingTimer, 200);
    showRecordingUI();
  } catch(e) { console.error('Mic error:', e); alert('Could not access microphone. Check that you have granted permission and are using HTTPS.'); }
}

function stopVoiceRecording() {
  if (_recordingMediaRecorder && _recordingMediaRecorder.state === 'recording') {
    _recordingMediaRecorder.stop();
  }
  if (_recordingInterval) { clearInterval(_recordingInterval); _recordingInterval = null; }
  hideRecordingUI();
}

function updateRecordingTimer() {
  var elapsed = Math.floor((Date.now() - _recordingStartTime) / 1000);
  var mins = Math.floor(elapsed / 60);
  var secs = elapsed % 60;
  var el = document.getElementById('recording-timer');
  if (el) el.textContent = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
}

function showRecordingUI() {
  var inputBar = document.querySelector('.chat-input-bar');
  if (!inputBar) return;
  inputBar.innerHTML = '<div class="voice-recorder"><div class="voice-rec-dot"></div><span class="voice-rec-timer" id="recording-timer">00:00</span><button class="voice-rec-stop" onclick="stopVoiceRecording()" title="Stop & send">⏹</button><button class="voice-rec-cancel" onclick="cancelVoiceRecording()">✕ Cancel</button></div>';
}

function hideRecordingUI() {
  if (_chatActiveConvId) renderChatConversation(_chatActiveConvId);
}

function cancelVoiceRecording() {
  _voiceRecordingCancelled = true;
  if (_recordingMediaRecorder && _recordingMediaRecorder.state === 'recording') {
    _recordingMediaRecorder.stream.getTracks().forEach(function(t) { t.stop(); });
    _recordingMediaRecorder.stop();
  }
  if (_recordingInterval) { clearInterval(_recordingInterval); _recordingInterval = null; }
  if (_chatActiveConvId) renderChatConversation(_chatActiveConvId);
}

async function searchGifs() {
  var input = document.getElementById('gif-search-input');
  var query = (input ? input.value.trim() : '') || 'funny';
  var grid = document.getElementById('gif-picker-grid');
  if (!grid) return;
  grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:20px">Loading...</div>';
  try {
    var resp = await fetch('https://api.giphy.com/v1/gifs/search?api_key=' + _giphyApiKey + '&q=' + encodeURIComponent(query) + '&limit=20&rating=g');
    var data = await resp.json();
    if (!data.data || !data.data.length) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:20px">No GIFs found</div>';
      return;
    }
    grid.innerHTML = data.data.map(function(g) {

      var preview = g.images.fixed_height_small.url;

    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--red);padding:20px">Error loading GIFs. Check your connection.</div>';

/* ===== Scheduled Messages ===== */
function showSchedulePicker() {
  document.querySelectorAll('.schedule-picker').forEach(function(el) { el.remove(); });
  var now = new Date();
  var min = now.toISOString().slice(0,16);
  var html = '<div class="schedule-picker" onclick="if(event.target===this)this.remove()"><div class="schedule-picker-content"><h3>Schedule Message</h3>';
  html += '<div class="form-group"><label>Send at:</label><input id="schedule-datetime" type="datetime-local" min="' + min + '" value="' + min + '"></div>';
  html += '<div class="form-group"><label>Message:</label><textarea id="schedule-text" placeholder="Type message to schedule..." rows="3"></textarea></div>';
  html += '<button class="btn-primary" onclick="scheduleMessage()" style="width:100%;margin-top:10px">Schedule</button>';
  html += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);

async function scheduleMessage() {
  var dtVal = document.getElementById('schedule-datetime').value;
  var text = document.getElementById('schedule-text').value.trim();
  if (!dtVal || !text) { alert('Enter date/time and message.'); return; }
  var s = getSession();
  if (!s || !_chatActiveConvId) return;
  var scheduledTime = new Date(dtVal);
  try {
    await db.collection('scheduledMessages').add({
      conversationId: _chatActiveConvId,
      sender: s.username,
      senderUid: s.uid,
      text: text,
      scheduledFor: firebase.firestore.Timestamp.fromDate(scheduledTime),
      sent: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.querySelector('.schedule-picker').remove();
  } catch(e) { console.error('Schedule error:', e); }
}

function startScheduledCheck() {
  if (_scheduledCheckInterval) clearInterval(_scheduledCheckInterval);
  _scheduledCheckInterval = setInterval(checkScheduledMessages, 15000);
}

async function checkScheduledMessages() {
  var s = getSession();
  if (!s) return;
  try {
    var now = firebase.firestore.Timestamp.now();
    var snap = await db.collection('scheduledMessages')
      .where('sent', '==', false)
      .where('scheduledFor', '<=', now)
      .limit(10).get();
    for (var i = 0; i < snap.docs.length; i++) {
      var doc = snap.docs[i];
      var data = doc.data();
      await sendMessage(data.conversationId, data.text, null, null);
      await doc.ref.update({ sent: true });
    }
  } catch(e) { /* silent */ }
}

async function autoCreateClassChats() {

  const classes = getClasses();
  for (const cls of classes) {
    const members = [cls.teacher, ...(cls.students || [])].filter(Boolean);
    if (members.includes(s.username)) {
      await findOrCreateConversation('class', members, cls.id, cls.name + ' - ' + cls.subject);
    }
  }
}

/* ===== Chat Context Menu ===== */
let _chatSelectedMsgs = {};
let _chatSelectionMode = false;

const CHAT_EMOJIS = ['👍','❤️','😂','😮','😢','😡','🎉','🔥','👏','✅','⭐','💯','🙏','🤔','👀','🚀'];

function showChatContextMenu(e, msgId) {

  items += '<button class="chat-ctx-item" onclick="showEmojiPicker(event,\'' + msgId + '\')"><span>😊</span> React</button>';

  items += '<button class="chat-ctx-item" onclick="starMsg(\'' + msgId + '\')"><span>⭐</span> Star</button>';

function findMsgSender(msgId) {
  if (!_chatActiveConvId) return null;
  const msgs = getMessagesForConv(_chatActiveConvId);
  const msg = msgs.find(m => m.id === msgId);
  return msg ? msg.sender : null;
}

function findMsgById(msgId) {
  if (!_chatActiveConvId) return null;
  const msgs = getMessagesForConv(_chatActiveConvId);
  return msgs.find(m => m.id === msgId) || null;
}

function scrollToMsg(msgId) {
  const el = document.querySelector('[data-msg-id="' + msgId + '"]');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* --- Reply --- */
function replyToMsg(msgId) {
  const msg = findMsgById(msgId);
  if (!msg) return;
  const input = document.getElementById('chat-input');
  if (input) {
    input.dataset.replyTo = msgId;
    input.placeholder = 'Replying to ' + msg.sender + '...';
    input.focus();
  }
  document.querySelectorAll('.chat-ctx-menu').forEach(el => el.remove());
}

function cancelReply() {
  const input = document.getElementById('chat-input');
  if (input) { delete input.dataset.replyTo; input.placeholder = 'Type a message...'; }
  renderChatConversation(_chatActiveConvId);
}

/* --- Emoji React --- */
function showEmojiPicker(e, msgId) {
  document.querySelectorAll('.emoji-picker').forEach(el => el.remove());
  const rect = e.currentTarget ? e.currentTarget.closest('.chat-ctx-menu').getBoundingClientRect() : { left: e.clientX, top: e.clientY };

  const picker = document.createElement('div');
  picker.className = 'emoji-picker show';
  picker.style.left = Math.min(rect.left + 190, window.innerWidth - 270) + 'px';
  picker.style.top = rect.top + 'px';

  CHAT_EMOJIS.forEach(emoji => {
    const btn = document.createElement('button');
    btn.textContent = emoji;
    btn.onclick = function() { addReaction(msgId, emoji); picker.remove(); };
    picker.appendChild(btn);
  });

  document.body.appendChild(picker);
  setTimeout(() => {
    document.addEventListener('click', function closePicker() {
      picker.remove();
      document.removeEventListener('click', closePicker);
    }, { once: true });
  }, 0);
}

async function addReaction(msgId, emoji) {
  if (!_chatActiveConvId) return;
  try {
    const ref = db.collection('chatMessages').doc(msgId);
    const doc = await ref.get();
    const reactions = (doc.data().reactions || []);
    const existing = reactions.find(r => r.emoji === emoji);
    if (existing) { existing.count = (existing.count || 1) + 1; }
    else { reactions.push({ emoji: emoji, count: 1 }); }
    await ref.update({ reactions: reactions });
    await loadMessagesForConv(_chatActiveConvId);
    renderChatConversation(_chatActiveConvId);
    renderChatSidebar();
  } catch(e) { console.error('Reaction error:', e); }
}

/* --- Star --- */
async function starMsg(msgId) {
  if (!_chatActiveConvId) return;
  const s = getSession();
  try {
    const ref = db.collection('chatMessages').doc(msgId);
    const doc = await ref.get();
    const starredBy = doc.data().starredBy || [];
    const idx = starredBy.indexOf(s.username);
    if (idx >= 0) { starredBy.splice(idx, 1); } else { starredBy.push(s.username); }
    await ref.update({ starredBy: starredBy });
    await loadMessagesForConv(_chatActiveConvId);
    renderChatConversation(_chatActiveConvId);
  } catch(e) { console.error('Star error:', e); }
  document.querySelectorAll('.chat-ctx-menu').forEach(el => el.remove());
}

/* --- Pin --- */
async function pinMsg(msgId) {
  if (!_chatActiveConvId) return;
  try {
    const ref = db.collection('conversations').doc(_chatActiveConvId);
    const doc = await ref.get();
    let pinned = doc.data().pinnedMsgs || [];
    if (pinned.includes(msgId)) { pinned = pinned.filter(x => x !== msgId); }
    else { pinned.push(msgId); }
    await ref.update({ pinnedMsgs: pinned });
    renderChatConversation(_chatActiveConvId);
  } catch(e) { console.error('Pin error:', e); }
  document.querySelectorAll('.chat-ctx-menu').forEach(el => el.remove());
}

/* --- Forward --- */
async function forwardMsg(msgId) {
  const msg = findMsgById(msgId);
  if (!msg) return;
  document.querySelectorAll('.chat-ctx-menu').forEach(el => el.remove());

  const convs = getConversations().filter(c => c.id !== _chatActiveConvId);
  let modalHtml = '<div class="chat-new-modal" onclick="if(event.target===this)this.remove()"><div class="chat-new-modal-content"><h3>Forward Message</h3>';
  modalHtml += '<p style="font-size:0.78rem;color:var(--muted);margin:8px 0">Choose a conversation:</p>';
  convs.forEach(c => {
    modalHtml += '<button class="chat-list-item" onclick="doForwardMsg(\'' + msgId + '\',\'' + c.id + '\')" style="cursor:pointer;width:100%;text-align:left"><div class="chat-list-item-avatar">' + getConversationInitial(c) + '</div><div class="chat-list-item-info"><div class="chat-list-item-name">' + getConversationDisplayName(c) + '</div></div></button>';
  });
  if (!convs.length) modalHtml += '<p style="color:var(--muted);font-size:0.82rem;text-align:center;padding:12px">No other conversations</p>';
  modalHtml += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', modalHtml);
}

async function doForwardMsg(msgId, toConvId) {
  const msg = findMsgById(msgId);
  if (!msg) return;
  await sendMessage(toConvId, msg.text || '', msg.file || null);
  const modal = document.querySelector('.chat-new-modal');
  if (modal) modal.remove();
  document.querySelectorAll('.chat-ctx-menu').forEach(el => el.remove());
}

/* --- Copy --- */
function copyMsg(msgId) {
  const msg = findMsgById(msgId);
  if (!msg || !msg.text) return;
  navigator.clipboard.writeText(msg.text).then(() => {}).catch(() => {});
  document.querySelectorAll('.chat-ctx-menu').forEach(el => el.remove());
}

/* --- Info --- */
async function msgInfo(msgId) {
  const msg = findMsgById(msgId);
  if (!msg) return;
  document.querySelectorAll('.chat-ctx-menu').forEach(el => el.remove());

  const conv = getConversations().find(c => c.id === _chatActiveConvId);
  const members = conv ? (conv.members || []) : [];
  const readBy = msg.readBy || [];
  const notRead = members.filter(m => !readBy.includes(m));
  const received = msg.receivedBy || [];

  const ts = msg.timestamp && msg.timestamp.seconds ? new Date(msg.timestamp.seconds * 1000) : (msg.timestamp ? new Date(msg.timestamp) : new Date());

  let html = '<div class="chat-new-modal" onclick="if(event.target===this)this.remove()"><div class="chat-new-modal-content"><h3>Message Info</h3>';
  html += '<p style="font-size:0.78rem;color:var(--muted);margin:6px 0">Sent: ' + ts.toLocaleString() + '</p>';
  html += '<p style="font-size:0.78rem;color:var(--muted);margin:6px 0">Sender: ' + msg.sender + '</p>';
  if (msg.edited) html += '<p style="font-size:0.78rem;color:var(--muted);margin:6px 0">Edited</p>';
  html += '<div style="margin-top:8px"><strong style="font-size:0.82rem">Read by (' + readBy.length + '/' + members.length + '):</strong>';
  if (readBy.length) {
    html += '<div style="font-size:0.78rem;color:#059669;margin-top:4px">' + readBy.join(', ') + '</div>';
  }
  if (notRead.length) {
    html += '<div style="font-size:0.78rem;color:var(--muted);margin-top:4px">Not yet read: ' + notRead.join(', ') + '</div>';
  }
  html += '</div></div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
}

/* --- Delete --- */
async function deleteMsg(msgId) {
  if (!confirm('Delete this message?')) return;
  try {
    await db.collection('chatMessages').doc(msgId).delete();
    await loadMessagesForConv(_chatActiveConvId);
    renderChatConversation(_chatActiveConvId);
    renderChatSidebar();
  } catch(e) { console.error('Delete error:', e); }
  document.querySelectorAll('.chat-ctx-menu').forEach(el => el.remove());
}

/* --- Select mode --- */
function enterSelectMode(msgId) {
  _chatSelectionMode = true;
  _chatSelectedMsgs = {};
  document.querySelectorAll('.chat-ctx-menu').forEach(el => el.remove());
  const container = document.querySelector('.chat-messages');
  if (container) container.classList.add('selection-mode');
  const bar = document.getElementById('chat-selection-bar');
  if (bar) bar.classList.add('show');
  toggleMsgSelect(null, msgId);
}

function toggleMsgSelect(el, msgId) {
  if (el) el.classList.toggle('checked');
  if (_chatSelectedMsgs[msgId]) { delete _chatSelectedMsgs[msgId]; }
  else { _chatSelectedMsgs[msgId] = true; }
  updateSelectionBar();
}

function updateSelectionBar() {
  const bar = document.getElementById('chat-selection-bar');
  const count = Object.keys(_chatSelectedMsgs).length;
  if (!bar) return;
  if (count === 0 && !_chatSelectionMode) {
    bar.classList.remove('show');
  } else {
    bar.classList.add('show');
    bar.innerHTML = '<strong>' + count + ' selected</strong>' +
      '<button onclick="deleteSelectedMsgs()" style="background:#dc2626;color:#fff;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:0.78rem">Delete</button>' +
      '<button onclick="forwardSelectedMsgs()" style="background:var(--accent);color:#fff;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:0.78rem">Forward</button>' +
      '<button onclick="cancelSelection()" style="background:transparent;border:1px solid rgba(255,255,255,0.4);color:#fff;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:0.78rem">Cancel</button>';
  }
}

function cancelSelection() {
  _chatSelectionMode = false;
  _chatSelectedMsgs = {};
  document.querySelector('.chat-messages').classList.remove('selection-mode');
  document.querySelectorAll('.chat-msg-select').forEach(el => el.classList.remove('checked'));
  const bar = document.getElementById('chat-selection-bar');
  if (bar) bar.classList.remove('show');
}

async function deleteSelectedMsgs() {
  const ids = Object.keys(_chatSelectedMsgs);
  if (!ids.length || !confirm('Delete ' + ids.length + ' message(s)?')) return;
  for (const id of ids) {
    try { await db.collection('chatMessages').doc(id).delete(); } catch(e) {}
  }
  cancelSelection();
  await loadMessagesForConv(_chatActiveConvId);
  renderChatConversation(_chatActiveConvId);
  renderChatSidebar();
}

async function forwardSelectedMsgs() {
  const ids = Object.keys(_chatSelectedMsgs);
  if (!ids.length) return;
  const convs = getConversations().filter(c => c.id !== _chatActiveConvId);
  let html = '<div class="chat-new-modal" onclick="if(event.target===this)this.remove()"><div class="chat-new-modal-content"><h3>Forward ' + ids.length + ' message(s)</h3>';
  html += '<p style="font-size:0.78rem;color:var(--muted);margin:8px 0">Choose destination:</p>';
  convs.forEach(c => {
    html += '<button class="chat-list-item" onclick="doForwardSelected(\'' + JSON.stringify(ids).replace(/'/g,'') + '\',\'' + c.id + '\')" style="cursor:pointer;width:100%;text-align:left"><div class="chat-list-item-avatar">' + getConversationInitial(c) + '</div><div class="chat-list-item-info"><div class="chat-list-item-name">' + getConversationDisplayName(c) + '</div></div></button>';
  });
  html += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
}

async function doForwardSelected(idsJson, toConvId) {
  const ids = JSON.parse(idsJson);
  const s = getSession();
  for (const id of ids) {
    const msg = findMsgById(id);
    if (msg) await sendMessage(toConvId, msg.text || '', msg.file || null);
  }
  cancelSelection();
  const modal = document.querySelector('.chat-new-modal');
  if (modal) modal.remove();
}
