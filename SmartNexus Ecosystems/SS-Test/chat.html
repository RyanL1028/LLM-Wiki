/* ===== Mobile Tab Switching ===== */
function switchMobileTab(tab) {
  _mobileActiveTab = tab;
  document.querySelectorAll('.mobile-page').forEach(function(p) {
    p.classList.add('hidden-right');
    p.classList.remove('hidden-left');
  });
  var fab = document.getElementById('mobile-fab');

  switch(tab) {
    case 'chats':
      document.getElementById('mobile-chats-page').classList.remove('hidden-right');
      if (fab) fab.classList.remove('fab-hidden');
      renderMobileChatList();
      renderMobileStoryRings();
      break;
    case 'stories':
      document.getElementById('mobile-stories-page').classList.remove('hidden-right');
      if (fab) fab.classList.add('fab-hidden');
      renderMobileStoriesPage();
      break;
    case 'calls':
      document.getElementById('mobile-calls-page').classList.remove('hidden-right');
      if (fab) fab.classList.add('fab-hidden');
      renderMobileCallsPage();
      break;
  }

  document.querySelectorAll('.mobile-tab').forEach(function(t) { t.classList.remove('active'); });
  var tabEl = document.getElementById('mobile-tab-' + tab);
  if (tabEl) tabEl.classList.add('active');
}

/* ===== Mobile Chat List ===== */
function renderMobileChatList(filter) {
  var list = document.getElementById('mobile-chat-list');
  if (!list) return;
  var conversations = getConversations();
  loadChatFolders();

  var folderConvs = [];
  _chatFolders.forEach(function(f) { folderConvs = folderConvs.concat(f.convs); });

  if (filter) {
    var q = filter.toLowerCase();
    conversations = conversations.filter(function(c) {
      return getConversationDisplayName(c).toLowerCase().indexOf(q) !== -1;
    });
  }

  if (!conversations.length) {
    list.innerHTML = '<div class="mobile-empty"><div class="mobile-empty-icon">💬</div><div class="mobile-empty-title">No chats yet</div><p>Tap + to start a conversation</p></div>';
    return;
  }

  function renderItem(c) {
    var messages = getMessagesForConv(c.id);
    var unread = getUnreadCount(c.id, messages);
    var lastMsg = c.lastMessage;
    return '<div class="mobile-chat-item" onclick="openMobileChat(\'' + c.id + '\')">' +
      '<div class="mobile-chat-avatar">' + getConversationInitial(c) + '</div>' +
      '<div class="mobile-chat-info">' +
        '<div class="mobile-chat-name">' + getConversationDisplayName(c) + '</div>' +
        '<div class="mobile-chat-preview">' + (lastMsg ? lastMsg.sender + ': ' + lastMsg.text : 'No messages yet') + '</div>' +
      '</div>' +
      '<div class="mobile-chat-meta">' +
        '<div class="mobile-chat-time">' + (lastMsg ? formatChatTimestamp(lastMsg.timestamp) : '') + '</div>' +
        (unread > 0 ? '<div class="mobile-chat-badge">' + (unread > 99 ? '99+' : unread) + '</div>' : '') +
      '</div>' +
    '</div>';
  }

  var html = '';
  _chatFolders.forEach(function(f) {
    var folderChats = conversations.filter(function(c) { return f.convs.includes(c.id); });
    if (!folderChats.length) return;
    html += '<div style="padding:8px 16px 4px;font-size:0.7rem;color:#999;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">' + f.name + '</div>';
    folderChats.forEach(function(c) { html += renderItem(c); });
  });

  var remaining = filter ? conversations : conversations.filter(function(c) { return !folderConvs.includes(c.id); });
  if (_chatFolders.length && !filter) {
    html += '<div style="padding:8px 16px 4px;font-size:0.7rem;color:#999;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">All Chats</div>';
  }
  remaining.forEach(function(c) { html += renderItem(c); });

  list.innerHTML = html;
}

function filterMobileChats(query) {
  renderMobileChatList(query);
}

/* ===== Mobile Story Rings (in Chats page) ===== */
function renderMobileStoryRings() {
  var container = document.getElementById('mobile-story-rings');
  if (!container) return;
  loadStories().then(function(stories) {
    if (!stories.length) { container.innerHTML = ''; return; }
    var seen = {};
    var unique = [];
    stories.forEach(function(s) {
      if (!seen[s.sender]) { seen[s.sender] = true; unique.push(s); }
    });
    if (!unique.length) { container.innerHTML = ''; return; }
    var html = '';
    html += '<div class="mobile-story-ring" onclick="showStoryCreator()"><div class="mobile-story-ring-outer new"><div class="mobile-story-ring-inner" style="background:#25d366;color:#fff">+</div></div><div class="mobile-story-ring-name">My Status</div></div>';
    unique.slice(0, 15).forEach(function(st) {
      html += '<div class="mobile-story-ring" onclick="openStoryViewer(\'' + st.sender + '\')"><div class="mobile-story-ring-outer"><div class="mobile-story-ring-inner">' + st.sender.charAt(0).toUpperCase() + '</div></div><div class="mobile-story-ring-name">' + st.sender + '</div></div>';
    });
    container.innerHTML = html;
  });
}

/* ===== Mobile Conversation ===== */
function openMobileChat(convId) {
  _chatActiveConvId = convId;
  var conv = getConversations().find(function(c) { return c.id === convId; });
  if (!conv) return;

  _detachAllListeners();

  document.getElementById('mobile-chats-page').classList.add('hidden-left');
  document.getElementById('mobile-conv-page').classList.remove('hidden-right');
  document.getElementById('mobile-fab').classList.add('fab-hidden');

  document.getElementById('mobile-conv-name').textContent = getConversationDisplayName(conv);
  var subtitle = '';
  if (conv.type !== 'dm') subtitle = (conv.members || []).length + ' members';
  document.getElementById('mobile-conv-subtitle').textContent = subtitle;
  document.getElementById('mobile-conv-subtitle').style.display = subtitle ? '' : 'none';

  loadMessagesForConv(convId).then(function() {
    markConversationRead(convId);
    markMessagesRead(convId);
    renderMobileConversation(convId);
    var msgsEl = document.getElementById('mobile-messages');
    if (msgsEl) msgsEl.scrollTop = msgsEl.scrollHeight;
  });

  _chatMsgListener = db.collection('chatMessages')
    .where('conversationId', '==', convId)
    .onSnapshot(function(snap) {
      loadMessagesForConv(convId).then(function() {
        renderMobileConversation(convId);
        if (document.hasFocus()) markMessagesRead(convId);
      });
    }, function(err) { console.error('Mobile msg listener error:', err); });

  _chatTypingListener = db.collection('typingStatus').doc(convId)
    .collection('status').onSnapshot(function(snap) {
      var s = getSession();
      var typing = [];
      var now = Date.now();
      snap.forEach(function(doc) {
        var d = doc.data();
        var ts = d.timestamp && d.timestamp.seconds ? d.timestamp.seconds * 1000 : 0;
        if (now - ts < 8000 && doc.id !== (s ? s.username : '')) typing.push(doc.id);
      });
      var el = document.getElementById('mobile-typing');
      if (!el) return;
      if (typing.length) {
        var names = typing.slice(0, 2).join(', ');
        if (typing.length > 2) names += ' and ' + (typing.length - 2) + ' more';
        el.style.display = '';
        el.innerHTML = names + ' typing<span class="chat-typing-dots"><span></span><span></span><span></span></span>';
      } else {
        el.style.display = 'none';
      }
    }, function(err) { /* silent */ });

  db.collection('polls').where('conversationId', '==', convId)
    .onSnapshot(function() { renderMobileConversation(convId); }, function() {});
}

function goBackToChatList() {
  _chatActiveConvId = null;
  _detachAllListeners();
  document.getElementById('mobile-conv-page').classList.add('hidden-right');
  document.getElementById('mobile-chats-page').classList.remove('hidden-left');
  document.getElementById('mobile-fab').classList.remove('fab-hidden');
  renderMobileChatList();
  renderMobileStoryRings();
}

function renderMobileConversation(convId) {
  var s = getSession();
  var conv = getConversations().find(function(c) { return c.id === convId; });
  var messages = getMessagesForConv(convId);
  var msgsEl = document.getElementById('mobile-messages');
  if (!msgsEl) return;

  var wasAtBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 80;

  var html = '';
  if (!messages.length) {
    html = '<div class="mobile-empty"><div class="mobile-empty-icon">💬</div><p>No messages yet. Say hello!</p></div>';
  } else {
    var pinnedIds = conv ? (conv.pinnedMsgs || []) : [];
    if (pinnedIds.length) {
      var pmsg = messages.find(function(m) { return pinnedIds.includes(m.id); });
      if (pmsg) {
        html += '<div class="mobile-pinned-bar" onclick="scrollToMsg(\'' + pmsg.id + '\')">📌 ' + pmsg.sender + ': ' + (pmsg.text || '(file)').substring(0, 80) + '</div>';
      }
    }

    var lastDate = '';
    messages.forEach(function(m) {
      var ts = m.timestamp && m.timestamp.seconds ? new Date(m.timestamp.seconds * 1000) : (m.timestamp ? new Date(m.timestamp) : new Date());
      var dateStr = ts.toLocaleDateString();
      if (dateStr !== lastDate) {
        html += '<div class="mobile-msg-date-divider"><span>' + dateStr + '</span></div>';
        lastDate = dateStr;
      }
      var isMine = m.sender === (s ? s.username : '');
      var reactions = m.reactions || [];
      var reactionHTML = reactions.length ? '<div class="mobile-msg-reactions">' + reactions.map(function(r) { return '<span class="chat-msg-reaction" onclick="addReaction(\'' + m.id + '\',\'' + r.emoji + '\')">' + r.emoji + '<span style="font-size:0.55rem;margin-left:1px">' + (r.count || 1) + '</span></span>'; }).join('') + '</div>' : '';

      html += '<div class="mobile-msg' + (isMine ? ' mine' : '') + '" data-msg-id="' + m.id + '" oncontextmenu="showChatContextMenu(event,\'' + m.id + '\')">';
      html += '<div>';
      if (!isMine && conv && conv.type !== 'dm') {
        html += '<div class="mobile-msg-sender">' + m.sender + '</div>';
      }
      html += '<div class="mobile-msg-bubble">';
      if (m.replyTo) {
        var rp = findMsgById(m.replyTo);
        if (rp) html += '<div class="chat-msg-reply-preview" onclick="scrollToMsg(\'' + m.replyTo + '\')">↩️ ' + rp.sender + ': ' + (rp.text || '(file)').substring(0, 100) + '</div>';
      }
      if (m.text) html += '<div class="chat-msg-text">' + _formatMsgText(m.text) + '</div>';
      html += _renderLinkPreviews(m);
      html += _renderPoll(m);
      if (m.file) html += _renderMsgFile(m, true);
      html += reactionHTML;
      html += '<div class="mobile-msg-meta">';
      if (m.edited) html += '<span class="mobile-msg-edited">edited</span>';
      html += ts.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      if (isMine) html += _renderReadReceipt(m);
      html += '</div>';
      html += '</div></div></div>';
    });
  }

  msgsEl.innerHTML = html;
  if (wasAtBottom) msgsEl.scrollTop = msgsEl.scrollHeight;

  // Restore reply bar
  var mobileInput = document.getElementById('mobile-chat-input');
  var savedReplyTo = mobileInput ? mobileInput.dataset.replyTo : '';
  var replyBar = document.getElementById('mobile-reply-bar');
  if (savedReplyTo) {
    var replyMsg = findMsgById(savedReplyTo);
    if (replyMsg && replyBar) {
      replyBar.style.display = 'flex';
      replyBar.querySelector('span').textContent = '↩️ Replying to ' + replyMsg.sender;
    }
  } else {
    if (replyBar) replyBar.style.display = 'none';
  }
}

/* ===== Mobile Send Message ===== */
async function sendMobileMessage() {
  var input = document.getElementById('mobile-chat-input');
  var text = input ? input.value.trim() : '';
  if ((!text && !_pendingChatFile) || !_chatActiveConvId) return;
  var replyTo = input ? input.dataset.replyTo : '';
  await sendMessage(_chatActiveConvId, text, _pendingChatFile, replyTo || null);
  if (input) { input.value = ''; delete input.dataset.replyTo; }
  _pendingChatFile = null;
  var preview = document.getElementById('chat-file-preview');
  if (preview) { preview.innerHTML = ''; preview.style.display = 'none'; }
  var replyBar = document.getElementById('mobile-reply-bar');
  if (replyBar) replyBar.style.display = 'none';
  renderMobileConversation(_chatActiveConvId);
  renderMobileChatList();
  var msgsEl = document.getElementById('mobile-messages');
  if (msgsEl) msgsEl.scrollTop = msgsEl.scrollHeight;
}

/* ===== Mobile Stories Page ===== */
function renderMobileStoriesPage() {
  var grid = document.getElementById('mobile-stories-grid');
  if (!grid) return;
  loadStories().then(function(stories) {
    var html = '';
    html += '<div class="mobile-stories-my" onclick="showStoryCreator()">';
    html += '<div class="mobile-stories-my-ring">+</div>';
    html += '<div class="mobile-stories-my-info"><div class="mobile-stories-my-label">My Status</div><div class="mobile-stories-my-hint">Tap to add status update</div></div>';
    html += '</div>';

    if (!stories.length) {
      html += '<div class="mobile-empty"><div class="mobile-empty-icon">◎</div><div class="mobile-empty-title">No recent updates</div></div>';
    } else {
      html += '<div class="mobile-stories-section-title">Recent Updates</div>';
      var seen = {};
      stories.forEach(function(st) {
        if (seen[st.sender]) return;
        seen[st.sender] = true;
        var ts = st.timestamp && st.timestamp.seconds ? new Date(st.timestamp.seconds * 1000) : new Date();
        var timeAgo = getTimeAgo(ts);
        html += '<div class="mobile-story-item" onclick="openStoryViewer(\'' + st.sender + '\')">';
        html += '<div class="mobile-story-item-ring"><div class="mobile-story-item-inner">' + (st.type === 'photo' ? '<img src="' + st.content + '" alt="">' : st.sender.charAt(0).toUpperCase()) + '</div></div>';
        html += '<div class="mobile-story-item-info"><div class="mobile-story-item-name">' + st.sender + '</div><div class="mobile-story-item-time">' + timeAgo + '</div></div>';
        html += '</div>';
      });
    }
    grid.innerHTML = html;
  });
}

function getTimeAgo(date) {
  var seconds = Math.floor((Date.now() - date.getTime()) / 1000);
  if (seconds < 60) return 'Just now';
  if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
  if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
  return Math.floor(seconds / 86400) + 'd ago';
}

/* ===== Mobile Calls Page ===== */
function renderMobileCallsPage() {
  var list = document.getElementById('mobile-calls-list');
  if (!list) return;
  db.collection('calls').orderBy('timestamp', 'desc').limit(30).get().then(function(snap) {
    var calls = [];
    snap.forEach(function(doc) {
      var d = doc.data(); d.id = doc.id; calls.push(d);
    });
    if (!calls.length) {
      list.innerHTML = '<div class="mobile-empty"><div class="mobile-empty-icon">📞</div><div class="mobile-empty-title">No recent calls</div><p>Your call history will appear here</p></div>';
      return;
    }
    var seen = {};
    var unique = [];
    calls.forEach(function(c) {
      var key = c.conversationId || c.caller;
      if (!seen[key]) { seen[key] = true; unique.push(c); }
    });
    var s = getSession();
    var html = '';
    unique.forEach(function(c) {
      var isIncoming = c.callerUid !== (s ? s.uid : '');
      var icon = isIncoming ? '↙' : '↗';
      var color = isIncoming ? (c.status === 'ended' ? '#ef4444' : '#25d366') : '#25d366';
      var conv = getConversations().find(function(x) { return x.id === c.conversationId; });
      var name = conv ? getConversationDisplayName(conv) : (c.caller || 'Unknown');
      var ts = c.timestamp && c.timestamp.seconds ? new Date(c.timestamp.seconds * 1000) : new Date();
      html += '<div class="mobile-call-item">';
      html += '<div class="mobile-call-avatar">' + name.charAt(0).toUpperCase() + '</div>';
      html += '<div class="mobile-call-info"><div class="mobile-call-name">' + name + '</div>';
      html += '<div class="mobile-call-detail"><span style="color:' + color + '">' + icon + '</span> ' + (c.mode || 'audio') + ' · ' + getTimeAgo(ts) + '</div></div>';
      html += '<div class="mobile-call-cta"><button onclick="initiateCall(\'' + (c.conversationId || '') + '\',\'' + (c.mode || 'audio') + '\')">📞</button></div>';
      html += '</div>';
    });
    list.innerHTML = html;
  }).catch(function() {
    list.innerHTML = '<div class="mobile-empty"><div class="mobile-empty-icon">📞</div><div class="mobile-empty-title">No recent calls</div></div>';
  });
}

/* ===== Mobile FAB ===== */
function onMobileFabClick() {
  renderNewChatModal();
}

/* ===== Mobile Hamburger Drawer ===== */
function toggleMobileDrawer() {
  var drawer = document.getElementById('mobile-drawer');
  var overlay = document.getElementById('mobile-drawer-overlay');
  var hamburger = document.getElementById('mobile-hamburger');
  var isOpen = drawer.classList.contains('open');
  if (isOpen) { closeMobileDrawer(); return; }
  // Build drawer content
  var s = getSession();
  var html = '';
  html += '<div class="mobile-drawer-header">';
  html += '<div class="mobile-drawer-avatar">' + (s ? (s.username || '?').charAt(0).toUpperCase() : '?') + '</div>';
  html += '<div><div class="mobile-drawer-user">' + (s ? s.username : 'User') + '</div>';
  html += '<div class="mobile-drawer-email">' + (s ? (s.email || s.phone || '') : '') + '</div></div>';
  html += '</div>';
  html += '<div class="mobile-drawer-items">';
  html += '<button class="mobile-drawer-item" onclick="closeMobileDrawer();renderNewChatModal()"><span class="mobile-drawer-item-icon">💬</span>New Chat</button>';
  html += '<button class="mobile-drawer-item" onclick="closeMobileDrawer();showFolderPrompt()"><span class="mobile-drawer-item-icon">📁</span>New Folder</button>';
  html += '<button class="mobile-drawer-item" onclick="closeMobileDrawer();showSearchModal()"><span class="mobile-drawer-item-icon">🔍</span>Search Messages</button>';
  var notifCount = unreadCount();
  html += '<button class="mobile-drawer-item" onclick="closeMobileDrawer();showMobileNotifications()"><span class="mobile-drawer-item-icon">🔔</span>Notifications' + (notifCount > 0 ? ' <span style="background:#ef4444;color:#fff;font-size:0.65rem;padding:2px 7px;border-radius:10px;margin-left:4px">' + (notifCount > 99 ? '99+' : notifCount) + '</span>' : '') + '</button>';
  html += '<div class="mobile-drawer-divider"></div>';
  html += '<button class="mobile-drawer-item" onclick="closeMobileDrawer();switchMobileTab(\'stories\')"><span class="mobile-drawer-item-icon">◎</span>Status</button>';
  html += '<button class="mobile-drawer-item" onclick="closeMobileDrawer();switchMobileTab(\'calls\')"><span class="mobile-drawer-item-icon">📞</span>Calls</button>';
  html += '<div class="mobile-drawer-divider"></div>';
  html += '<button class="mobile-drawer-item" onclick="toggleTheme();closeMobileDrawer()"><span class="mobile-drawer-item-icon">' + (document.body.classList.contains('dark') ? '☀️' : '🌙') + '</span>' + (document.body.classList.contains('dark') ? 'Light Mode' : 'Dark Mode') + '</button>';
  html += '<div class="mobile-drawer-divider"></div>';
  html += '<button class="mobile-drawer-item danger" onclick="closeMobileDrawer();doLogout()"><span class="mobile-drawer-item-icon">🚪</span>Logout</button>';
  html += '</div>';
  html += '<div class="mobile-drawer-footer">';
  html += '<a href="https://smart-study-site.web.app" target="_blank">📚 Main Site</a>';
  html += '<a href="https://smart-study-staff.web.app" target="_blank">🔧 Staff Centre</a>';
  html += '<a href="https://smart-study-wiki.web.app" target="_blank">📖 Wiki</a>';
  html += '</div>';
  drawer.innerHTML = html;
  drawer.classList.add('open');
  overlay.classList.add('open');
  if (hamburger) hamburger.classList.add('open');
}

function closeMobileDrawer() {
  var drawer = document.getElementById('mobile-drawer');
  var overlay = document.getElementById('mobile-drawer-overlay');
  var hamburger = document.getElementById('mobile-hamburger');
  if (drawer) drawer.classList.remove('open');
  if (overlay) overlay.classList.remove('open');
  if (hamburger) hamburger.classList.remove('open');
}

function showMobileNotifications() {
  document.querySelectorAll('.mobile-notif-modal').forEach(function(el) { el.remove(); });
  var html = '<div class="mobile-notif-modal" onclick="if(event.target===this)this.remove()" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding-top:max(60px,env(safe-area-inset-top))">';
  html += '<div style="background:var(--surface);border-radius:12px;width:92%;max-width:400px;max-height:70vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,0.2)" onclick="event.stopPropagation()">';
  html += '<div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between"><h3 style="margin:0;font-size:1rem">Notifications</h3><button onclick="clearNotifications();document.querySelector(\'.mobile-notif-modal\').remove();renderMobileChatList()" style="background:none;border:none;color:var(--accent);font-size:0.78rem;cursor:pointer">Clear all</button></div>';
  html += '<div style="max-height:55vh;overflow-y:auto">' + buildNotificationHtml() + '</div>';
  html += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
}

/* ===== Mobile: Override sendChatMessage to use mobile input ===== */
var _origSendChatMessage = sendChatMessage;
sendChatMessage = function() {
  if (isMobileDevice()) { sendMobileMessage(); return; }
  _origSendChatMessage();
};

/* ===== Mobile: Override selectConversation ===== */
var _origSelectConversation = selectConversation;
selectConversation = function(convId) {
  if (isMobileDevice()) { openMobileChat(convId); return; }
  _origSelectConversation(convId);
};

/* ===== Mobile: Handle resize ===== */
window.addEventListener('resize', function() {
  var wasMobile = document.querySelector('.mobile-tabs') !== null;
  var nowMobile = isMobileDevice();
  if (wasMobile !== nowMobile) {
    if (getRoute() === 'chats' && getSession()) {
      renderChat(document.getElementById('main'));
    }
  }
});

/* ===== Mobile: Override renderChatConversation ===== */
var _origRenderChatConversation = renderChatConversation;
renderChatConversation = function(convId) {
  if (isMobileDevice()) { openMobileChat(convId); return; }
  _origRenderChatConversation(convId);
};

/* ===== Mobile: Override showChatSidebar ===== */
var _origShowChatSidebar = showChatSidebar;
showChatSidebar = function() {
  if (isMobileDevice()) { goBackToChatList(); return; }
  _origShowChatSidebar();
};

/* ===== Mobile: Override renderChatSidebar ===== */
var _origRenderChatSidebar = renderChatSidebar;
renderChatSidebar = function() {
  if (isMobileDevice()) { renderMobileChatList(); return; }
  _origRenderChatSidebar();
};

/* --- Group Chat Picture --- */
function triggerConvPicUpload() {
  const input = document.getElementById('conv-pic-input');
  if (input) input.click();
}

async function handleConvPicSelected(input) {
  const file = input.files[0];
  if (!file || !_chatActiveConvId) return;
  const reader = new FileReader();
  reader.onload = async function() {
    try {
      await db.collection('conversations').doc(_chatActiveConvId).update({ picture: reader.result, picSize: file.size });
      renderChatConversation(_chatActiveConvId);
      renderChatSidebar();
    } catch(e) { console.error('Picture upload error:', e); }
  };
  reader.readAsDataURL(file);
}
