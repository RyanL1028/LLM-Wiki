<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Three interconnected rings representing ecosystem + nexus -->
  <!-- Top ring -->
  <circle cx="60" cy="32" r="22" stroke="url(#g1)" stroke-width="4.5" fill="none" opacity="0.9"/>
  <!-- Bottom-left ring -->
  <circle cx="36" cy="70" r="22" stroke="url(#g2)" stroke-width="4.5" fill="none" opacity="0.85"/>
  <!-- Bottom-right ring -->
  <circle cx="84" cy="70" r="22" stroke="url(#g1)" stroke-width="4.5" fill="none" opacity="0.85"/>
  <!-- Central nexus node -->
  <circle cx="60" cy="57" r="8" fill="url(#g1)" opacity="0.95"/>
  <!-- Connection lines from center to rings -->
  <line x1="60" y1="49" x2="60" y2="38" stroke="#0d9488" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="55" y1="61" x2="44" y2="67" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="65" y1="61" x2="76" y2="67" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>
