<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
  </defs>
  <!-- Circular background -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="url(#g1)" stroke-width="4" opacity="0.15"/>
  <!-- Three interconnected rings -->
  <!-- Top ring -->
  <circle cx="256" cy="148" r="86" stroke="url(#g1)" stroke-width="18" fill="none" opacity="0.9"/>
  <!-- Bottom-left ring -->
  <circle cx="167" cy="296" r="86" stroke="url(#g2)" stroke-width="18" fill="none" opacity="0.85"/>
  <!-- Bottom-right ring -->
  <circle cx="345" cy="296" r="86" stroke="url(#g1)" stroke-width="18" fill="none" opacity="0.85"/>
  <!-- Central nexus node -->
  <circle cx="256" cy="244" r="32" fill="url(#g1)" opacity="0.95"/>
  <!-- Connection lines from center -->
  <line x1="256" y1="212" x2="256" y2="170" stroke="#0d9488" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
  <line x1="236" y1="258" x2="192" y2="282" stroke="#14b8a6" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
  <line x1="276" y1="258" x2="320" y2="282" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
</svg>
